name: dga-lab
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: dga_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dga_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dga_local -d dga_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  object-store:
    build:
      context: ./deploy/minio
      target: server
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: dga-local
      MINIO_ROOT_PASSWORD: local-object-storage-only
    volumes:
      - object-store-data:/data
  object-store-init:
    build:
      context: ./deploy/minio
      target: client
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://object-store:9000 dga-local local-object-storage-only;
        do sleep 1; done;
        mc mb --ignore-existing local/dga-lab
    depends_on:
      object-store:
        condition: service_started
  migrate:
    build: ./backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://dga_local:local-development-only@db:5432/dga_local
      COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: "http://127.0.0.1:${DGA_PORT:-8080},http://localhost:${DGA_PORT:-8080},http://127.0.0.1:5173,http://localhost:5173"
      OBJECT_STORE_ENDPOINT: http://object-store:9000
      OBJECT_STORE_BUCKET: dga-lab
      OBJECT_STORE_ACCESS_KEY: dga-local
      OBJECT_STORE_SECRET_KEY: local-object-storage-only
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      <<: *app-env
      OIDC_ENCRYPTION_KEY: ${OIDC_ENCRYPTION_KEY:-}
      OIDC_ALLOWED_HOSTS: ${OIDC_ALLOWED_HOSTS:-}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      OIDC_CALLBACK_ORIGINS: ${OIDC_CALLBACK_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=8)"]
      interval: 5s
      timeout: 10s
      retries: 12
  import-worker:
    build: ./backend
    environment: *app-env
    command: ["python", "-m", "dga.assets.import_worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  report-worker:
    build: ./backend
    environment: *app-env
    command: ["python", "-m", "dga.laboratory.report_worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
  test-db:
    image: postgres:17-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: dga_test
      POSTGRES_PASSWORD: isolated-tests-only
      POSTGRES_DB: dga_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dga_test -d dga_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${DGA_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
  api-test:
    build: ./backend
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://dga_test:isolated-tests-only@test-db:5432/dga_test
      TEST_DATABASE_URL: postgresql+psycopg://dga_test:isolated-tests-only@test-db:5432/dga_test
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres-data:
  object-store-data:
