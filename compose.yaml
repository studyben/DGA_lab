name: dga-lab
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: dga_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dga_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dga_local -d dga_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: ./backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://dga_local:local-development-only@db:5432/dga_local
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=8)"]
      interval: 5s
      timeout: 10s
      retries: 12
  test-db:
    image: postgres:17-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: dga_test
      POSTGRES_PASSWORD: isolated-tests-only
      POSTGRES_DB: dga_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dga_test -d dga_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
  browser-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    profiles: [test]
    environment:
      BASE_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
  api-test:
    build: ./backend
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://dga_test:isolated-tests-only@test-db:5432/dga_test
      TEST_DATABASE_URL: postgresql+psycopg://dga_test:isolated-tests-only@test-db:5432/dga_test
    command: ["pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres-data:
