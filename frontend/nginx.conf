log_format oidc_safe 'OIDC $request_method status=$status upstream=$upstream_status time=$request_time';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    location /api/auth/oidc/ {
        # Nginx error logs append the raw request line on upstream failures.
        # Suppress that channel here; retain status/timing in a query-free log.
        error_log /dev/null;
        access_log /dev/stdout oidc_safe;
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /api/assets/imports {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
